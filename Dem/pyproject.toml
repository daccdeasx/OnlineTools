[project]
name = "OnlineTools"
version = "0.1.0"
description = "OnlineTools backend - FastAPI based lightweight API server"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OnlineTools Team" }]
keywords = ["online-tools", "fastapi", "utilities"]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "PyJWT>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
